name: AdviCue AI — Prototype Checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install -r requirements-dev.txt
      - name: Backend tests (synthetic fixtures)
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: advicue_ci
          POSTGRES_PASSWORD: ci_local_only_password
          POSTGRES_DB: advicue_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advicue_ci -d advicue_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://advicue_ci:ci_local_only_password@127.0.0.1:5432/advicue_ci
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver and backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Create PostgreSQL schema with Alembic
        run: python -m alembic upgrade head
      - name: Verify schema and configuration against PostgreSQL
        run: python -m app.scripts.release_preflight --strict
